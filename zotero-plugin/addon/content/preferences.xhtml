<vbox id="zw-prefs-root" class="zw-prefs main-section">
  <groupbox>
    <label><html:h2>运行</html:h2></label>
    <html:p class="zw-hint">ZotWatch 根据你的 Zotero 文库构建研究画像，每天从 Crossref / arXiv / EarthArXiv 抓取新文献并按相关性推荐，也可以追踪指定作者的新论文和顶刊中的地学文章。推荐结果在「工具 → ZotWatch 文献推荐」中查看。</html:p>
    <checkbox native="true" label="每天自动检查新文献（Zotero 运行时在后台进行）" preference="extensions.zotwatch.schedule.autoRun"/>
    <html:div class="zw-grid">
      <html:label for="zw-interval">检查间隔（小时）</html:label>
      <html:input type="number" id="zw-interval" min="1" preference="extensions.zotwatch.schedule.intervalHours"/>
    </html:div>
    <hbox class="zw-buttons">
      <button id="zw-run" label="立即运行并查看推荐"/>
      <button id="zw-test" label="测试连接"/>
      <button id="zw-status-refresh" label="刷新状态"/>
    </hbox>
    <html:pre id="zw-output" class="zw-output"></html:pre>
  </groupbox>

  <groupbox>
    <label><html:h2>向量化服务（语义相似度）</html:h2></label>
    <html:div class="zw-grid">
      <html:label for="zw-embedding-provider">服务商</html:label>
      <menulist id="zw-embedding-provider" native="true" preference="extensions.zotwatch.embedding.provider">
        <menupopup>
          <menuitem label="本地模式（无需 API Key，效果一般）" value="local"/>
          <menuitem label="阿里云 DashScope（推荐，text-embedding-v4）" value="dashscope"/>
          <menuitem label="Voyage AI（voyage-3.5）" value="voyage"/>
          <menuitem label="OpenAI 兼容接口（OpenAI / 硅基流动 / Ollama …）" value="openai"/>
        </menupopup>
      </menulist>
      <html:label for="zw-embedding-key">API Key</html:label>
      <html:input type="password" id="zw-embedding-key" preference="extensions.zotwatch.embedding.apiKey"/>
      <html:label for="zw-embedding-model">模型（留空用默认）</html:label>
      <html:input type="text" id="zw-embedding-model" preference="extensions.zotwatch.embedding.model"/>
      <html:label for="zw-embedding-baseurl">接口地址（仅 OpenAI 兼容）</html:label>
      <html:input type="text" id="zw-embedding-baseurl" placeholder="https://api.openai.com/v1" preference="extensions.zotwatch.embedding.baseURL"/>
    </html:div>
    <html:p class="zw-hint">更换服务商或模型后，首次运行会重新向量化整个文库。向量缓存保存在 Zotero 数据目录的 zotwatch 文件夹中。</html:p>
  </groupbox>

  <groupbox>
    <label><html:h2>文献来源</html:h2></label>
    <checkbox native="true" label="Crossref（按关注期刊 ISSN 抓取正式发表论文）" preference="extensions.zotwatch.sources.crossref.enabled"/>
    <html:div class="zw-grid">
      <html:label for="zw-mailto">Crossref 联系邮箱（礼貌池，推荐填写）</html:label>
      <html:input type="email" id="zw-mailto" preference="extensions.zotwatch.sources.crossref.mailto"/>
      <html:label for="zw-crossref-days">回溯天数</html:label>
      <html:input type="number" id="zw-crossref-days" min="1" preference="extensions.zotwatch.sources.crossref.daysBack"/>
    </html:div>
    <checkbox native="true" label="arXiv 预印本" preference="extensions.zotwatch.sources.arxiv.enabled"/>
    <html:div class="zw-grid">
      <html:label for="zw-arxiv-cats">arXiv 分类（逗号分隔）</html:label>
      <html:input type="text" id="zw-arxiv-cats" placeholder="physics.geo-ph, astro-ph.EP" preference="extensions.zotwatch.sources.arxiv.categories"/>
    </html:div>
    <checkbox native="true" label="EarthArXiv 地学预印本" preference="extensions.zotwatch.sources.eartharxiv.enabled"/>
    <html:label class="zw-block-label zw-subhead">摘要补全</html:label>
    <html:p class="zw-hint">论文缺少摘要时按 Crossref → Elsevier → Springer Nature → OpenAlex 的顺序查找，找到的摘要缓存 30 天，各来源都确认没有的 7 天内不再查询。</html:p>
    <checkbox native="true" label="从 Crossref 补全（预印本等非期刊来源）" preference="extensions.zotwatch.abstracts.crossref"/>
    <checkbox native="true" label="从 OpenAlex 补全" preference="extensions.zotwatch.sources.openalexAbstracts"/>
    <html:div class="zw-grid">
      <html:label for="zw-elsevier-key">Elsevier API Key（可选，补 10.1016 期刊摘要）</html:label>
      <html:input type="password" id="zw-elsevier-key" preference="extensions.zotwatch.abstracts.elsevierKey"/>
      <html:label for="zw-springer-key">Springer Nature API Key（可选，补 10.1007 / 10.1038 期刊摘要）</html:label>
      <html:input type="password" id="zw-springer-key" preference="extensions.zotwatch.abstracts.springerKey"/>
    </html:div>
    <html:p class="zw-hint">申请：dev.elsevier.com / dev.springernature.com。只发送 DOI。</html:p>
  </groupbox>

  <groupbox>
    <label><html:h2>关注期刊</html:h2></label>
    <checkbox native="true" label="自动关注文库中最常见的期刊" preference="extensions.zotwatch.journals.autoFromLibrary"/>
    <html:div class="zw-grid">
      <html:label for="zw-auto-top">自动关注的期刊数量</html:label>
      <html:input type="number" id="zw-auto-top" min="1" preference="extensions.zotwatch.journals.autoTopN"/>
    </html:div>
    <html:p class="zw-hint">期刊白名单（CSV：issn,title,category,impact_factor）。影响因子参与打分（权重 20%），未列出的期刊按默认分计算。</html:p>
    <html:textarea id="zw-whitelist" class="zw-textarea" rows="8" spellcheck="false"></html:textarea>
    <hbox class="zw-buttons">
      <button id="zw-journals-suggest" label="从文库生成期刊列表"/>
      <button id="zw-journals-import" label="导入 CSV 文件…"/>
      <button id="zw-journals-preset" label="载入地学期刊示例"/>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2>关注作者</html:h2></label>
    <checkbox native="true" label="关注指定作者的新论文（通过 OpenAlex，按 ORCID 识别）" preference="extensions.zotwatch.followed.enabled"/>
    <html:p class="zw-hint">每行一位作者：姓名 + ORCID（或 OpenAlex 作者 ID）。关注作者的论文不参与评分，只与文库去重。</html:p>
    <html:label for="zw-followed-authors" class="zw-block-label">作者列表（以 # 开头的行会被忽略）</html:label>
    <html:textarea id="zw-followed-authors" class="zw-textarea" rows="5" spellcheck="false" placeholder="汪在聪, 0000-0002-3584-1673&#10;Jay J. Ague, https://orcid.org/0000-0001-8408-0279" preference="extensions.zotwatch.followed.authors"></html:textarea>
    <html:div class="zw-grid">
      <html:label for="zw-followed-days">每次检查最近 N 天发表的论文</html:label>
      <html:input type="number" id="zw-followed-days" min="7" max="365" preference="extensions.zotwatch.followed.daysBack"/>
    </html:div>
  </groupbox>

  <groupbox>
    <label><html:h2>顶刊地学速览</html:h2></label>
    <checkbox native="true" label="单独追踪顶刊中的地学文章（Nature、Science、PNAS 等）" preference="extensions.zotwatch.flagship.enabled"/>
    <html:p class="zw-hint">这些期刊的文章不按文库相似度筛选，而是比较摘要与「地学领域描述」和各「排除领域」的语义相似度：离任一排除领域更近的不要，达到接受阈值的保留，介于灰区下限和接受阈值之间的交给大模型复核（未启用大模型时全部保留）。结果单独列为「顶刊地学速览」，按发表时间从新到旧排列。</html:p>
    <html:p class="zw-hint">阈值留空时按向量化服务自动取值：API 模式 0.30 / 0.22（按 DashScope text-embedding-v4 调校）；本地模式只比较字面词汇，取 0.12 / 0.04，效果较粗糙，建议开启大模型复核或改用 DashScope。</html:p>
    <html:label for="zw-flagship-issns" class="zw-block-label">顶刊 ISSN（逗号或换行分隔，留空用默认）</html:label>
    <html:textarea id="zw-flagship-issns" class="zw-textarea" rows="3" spellcheck="false" preference="extensions.zotwatch.flagship.issns"></html:textarea>
    <html:div class="zw-grid">
      <html:label for="zw-flagship-max">每次最多显示（0 不限）</html:label>
      <html:input type="number" id="zw-flagship-max" min="0" max="200" preference="extensions.zotwatch.flagship.maxResults"/>
      <html:label for="zw-flagship-min">接受阈值（留空自动）</html:label>
      <html:input type="text" id="zw-flagship-min" placeholder="自动" preference="extensions.zotwatch.flagship.minScore"/>
      <html:label for="zw-flagship-gray">灰区下限（留空自动）</html:label>
      <html:input type="text" id="zw-flagship-gray" placeholder="自动" preference="extensions.zotwatch.flagship.grayLow"/>
    </html:div>
    <checkbox native="true" label="灰区文章交给大模型复核（需开启大模型）" preference="extensions.zotwatch.flagship.llmFallback"/>
    <html:label for="zw-flagship-positive" class="zw-block-label">地学领域描述（英文，留空用默认）</html:label>
    <html:textarea id="zw-flagship-positive" class="zw-textarea" rows="3" spellcheck="false" preference="extensions.zotwatch.flagship.positiveAnchor"></html:textarea>
    <html:label for="zw-flagship-negative" class="zw-block-label">排除领域锚点（每行一个，留空用默认）</html:label>
    <html:textarea id="zw-flagship-negative" class="zw-textarea" rows="6" spellcheck="false" preference="extensions.zotwatch.flagship.negativeAnchors"></html:textarea>
    <html:label for="zw-flagship-boundary" class="zw-block-label">大模型复核标准（留空用默认）</html:label>
    <html:textarea id="zw-flagship-boundary" class="zw-textarea" rows="3" spellcheck="false" preference="extensions.zotwatch.flagship.llmBoundary"></html:textarea>
  </groupbox>

  <groupbox>
    <label><html:h2>推荐与过滤</html:h2></label>
    <html:div class="zw-grid">
      <html:label for="zw-topk">每次推荐数量</html:label>
      <html:input type="number" id="zw-topk" min="1" preference="extensions.zotwatch.scoring.topK"/>
      <html:label for="zw-recent">只保留最近 N 天发表</html:label>
      <html:input type="number" id="zw-recent" min="0" preference="extensions.zotwatch.scoring.recentDays"/>
      <html:label for="zw-minsim">最低相似度（留空自动）</html:label>
      <html:input type="text" id="zw-minsim" placeholder="自动" preference="extensions.zotwatch.scoring.minSimilarity"/>
      <html:label for="zw-preprint">预印本最大占比（0–1）</html:label>
      <html:input type="text" id="zw-preprint" preference="extensions.zotwatch.scoring.maxPreprintRatio"/>
    </html:div>
    <checkbox native="true" label="排除没有摘要的文献" preference="extensions.zotwatch.scoring.requireAbstract"/>
    <html:label for="zw-include" class="zw-block-label">必须包含的关键词（任一命中即保留，留空不限）</html:label>
    <html:textarea id="zw-include" class="zw-textarea" rows="2" spellcheck="false" preference="extensions.zotwatch.scoring.includeKeywords"></html:textarea>
    <html:label for="zw-exclude" class="zw-block-label">排除关键词（逗号或换行分隔）</html:label>
    <html:textarea id="zw-exclude" class="zw-textarea" rows="2" spellcheck="false" preference="extensions.zotwatch.scoring.excludeKeywords"></html:textarea>
  </groupbox>

  <groupbox>
    <label><html:h2>AI 摘要与标题翻译（可选）</html:h2></label>
    <checkbox native="true" label="启用大模型（OpenAI 兼容接口：OpenRouter / DeepSeek / Kimi / 通义千问 …）" preference="extensions.zotwatch.llm.enabled"/>
    <html:div class="zw-grid">
      <html:label for="zw-llm-preset">快速填写</html:label>
      <menulist id="zw-llm-preset" native="true">
        <menupopup>
          <menuitem label="选择服务商…" value=""/>
          <menuitem label="OpenRouter" value="openrouter"/>
          <menuitem label="DeepSeek" value="deepseek"/>
          <menuitem label="Kimi（Moonshot）" value="kimi"/>
          <menuitem label="阿里云百炼（通义千问）" value="dashscope"/>
        </menupopup>
      </menulist>
      <html:label for="zw-llm-url">接口地址</html:label>
      <html:input type="text" id="zw-llm-url" preference="extensions.zotwatch.llm.baseURL"/>
      <html:label for="zw-llm-key">API Key</html:label>
      <html:input type="password" id="zw-llm-key" preference="extensions.zotwatch.llm.apiKey"/>
      <html:label for="zw-llm-model">模型</html:label>
      <html:input type="text" id="zw-llm-model" preference="extensions.zotwatch.llm.model"/>
      <html:label for="zw-llm-topn">每次自动生成摘要的篇数</html:label>
      <html:input type="number" id="zw-llm-topn" min="0" preference="extensions.zotwatch.llm.summaryTopN"/>
    </html:div>
    <checkbox native="true" label="将英文标题翻译为中文" preference="extensions.zotwatch.llm.translateTitles"/>
    <checkbox native="true" label="为文库研究方向生成主题标签（会把每个方向的代表性标题发送给大模型）" preference="extensions.zotwatch.llm.topicLabels"/>
    <html:p class="zw-hint">研究方向来自文库的语义聚类，标签只生成一次并在之后的运行中沿用（文库变化较大时才为新的方向补充标签）；推荐卡片和子笔记会显示论文最接近的研究方向。</html:p>
  </groupbox>

  <groupbox>
    <label><html:h2>加入 Zotero</html:h2></label>
    <html:div class="zw-grid">
      <html:label for="zw-collection">保存到分类</html:label>
      <html:input type="text" id="zw-collection" preference="extensions.zotwatch.output.collection"/>
      <html:label for="zw-tag">添加标签</html:label>
      <html:input type="text" id="zw-tag" preference="extensions.zotwatch.output.tag"/>
    </html:div>
    <checkbox native="true" label="通过 DOI / arXiv 号抓取完整元数据（与「通过标识符添加条目」相同）" preference="extensions.zotwatch.output.useTranslator"/>
    <checkbox native="true" label="把 AI 摘要保存为子笔记" preference="extensions.zotwatch.output.summaryNote"/>
    <hbox class="zw-buttons">
      <button id="zw-reset" label="清除 ZotWatch 缓存与推荐记录…"/>
    </hbox>
  </groupbox>
</vbox>
