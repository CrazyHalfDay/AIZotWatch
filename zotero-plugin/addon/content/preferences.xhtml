<vbox id="zw-prefs-root" class="zw-prefs main-section">
  <html:div class="zw-card">
    <html:div class="zw-head">
      <html:img class="zw-logo" src="chrome://zotwatch/content/icons/icon.svg" alt="" width="40" height="40"/>
      <html:div class="zw-head-text">
        <html:h2 class="zw-title">ZotWatch</html:h2>
        <html:p class="zw-desc">根据你的 Zotero 文库每天推荐新发表的相关文献，也可以追踪指定作者的新论文和顶刊中的地学文章。</html:p>
      </html:div>
    </html:div>
    <html:div class="zw-rows">
      <html:div class="zw-row">
        <html:span class="zw-key">待查看</html:span>
        <html:span id="zw-pending" class="zw-value">–</html:span>
      </html:div>
      <html:div class="zw-row">
        <html:span class="zw-key">上次检查</html:span>
        <html:span id="zw-last" class="zw-value">–</html:span>
      </html:div>
      <html:div class="zw-row">
        <html:span class="zw-key">向量化</html:span>
        <html:span id="zw-embedding" class="zw-value">–</html:span>
      </html:div>
    </html:div>
    <hbox class="zw-buttons">
      <button id="zw-open" label="打开 ZotWatch"/>
      <button id="zw-open-settings" label="打开设置"/>
      <button id="zw-run" label="立即检查"/>
    </hbox>
    <html:p class="zw-hint">所有设置已移至 ZotWatch 主窗口（工具 → ZotWatch 文献推荐）。</html:p>
  </html:div>
</vbox>
