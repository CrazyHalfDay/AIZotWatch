<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN" id="zotwatch-main" windowtype="zotwatch:main"

<head>
  <meta charset="utf-8"/>
  <title>ZotWatch</title>
  <link rel="stylesheet" href="chrome://zotwatch/content/main.css"/>
  <link rel="stylesheet" href="chrome://zotwatch/content/overview.css"/>
  <link rel="stylesheet" href="chrome://zotwatch/content/inbox.css"/>
  <link rel="stylesheet" href="chrome://zotwatch/content/survey.css"/>
  <link rel="stylesheet" href="chrome://zotwatch/content/settings.css"/>
  <link rel="stylesheet" href="chrome://zotwatch/content/search.css"/>
  <!-- Labels of the Cut / Copy / Paste context menu of text fields (as in Zotero's own windows) -->
  <link rel="localization" href="browser/menubar.ftl"/>
  <link rel="localization" href="toolkit/global/textActions.ftl"/>
  <!-- HTML inputs in a chrome window get a context menu only from Zotero's edit overlay -->
  <script src="chrome://global/content/globalOverlay.js"></script>
  <script src="chrome://zotero/content/editMenuOverlay.js"></script>
  <!-- main.js before the page scripts: it defines the helpers and the page registry they use -->
  <script src="chrome://zotwatch/content/main.js"></script>
  <!-- Shared search-and-add component (createSearchBox) of the page scripts -->
  <script src="chrome://zotwatch/content/search.js"></script>
  <script src="chrome://zotwatch/content/overview.js"></script>
  <script src="chrome://zotwatch/content/inbox.js"></script>
  <script src="chrome://zotwatch/content/survey.js"></script>
  <script src="chrome://zotwatch/content/settings.js"></script>
</head>
<body>

  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-icon" src="chrome://zotwatch/content/icons/icon.svg" alt="" width="28" height="28"/>
        <div class="brand-text">
          <span class="brand-name">ZotWatch</span>
          <span id="brand-version" class="brand-version"></span>
        </div>
      </div>

      <nav class="nav" role="navigation" aria-label="ZotWatch">
        <button type="button" class="nav-item" data-page="overview" title="概览（Ctrl+1）">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon" aria-hidden="true"><use href="#i-overview"/></svg>
          <span class="nav-label">概览</span>
        </button>
        <button type="button" class="nav-item" data-page="inbox" title="推荐（Ctrl+2）">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon" aria-hidden="true"><use href="#i-inbox"/></svg>
          <span class="nav-label">推荐</span>
          <span id="nav-count" class="nav-count" hidden="hidden">0</span>
        </button>
        <button type="button" class="nav-item" data-page="survey" title="调研（Ctrl+4）">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon" aria-hidden="true"><use href="#i-survey"/></svg>
          <span class="nav-label">调研</span>
          <!-- A survey runs in the background (survey.js) -->
          <span id="nav-survey-dot" class="nav-dot" hidden="hidden" title="正在调研"><span class="dot running"></span><span class="nav-dot-label">进行中</span></span>
        </button>
        <button type="button" class="nav-item" data-page="settings" title="设置（Ctrl+3）">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon" aria-hidden="true"><use href="#i-settings"/></svg>
          <span class="nav-label">设置</span>
        </button>
        <div id="settings-nav" class="subnav" hidden="hidden"></div>
      </nav>

      <div class="sidebar-footer" id="run-footer">
        <div class="run-line">
          <span id="run-dot" class="dot idle"></span>
          <span id="run-status" class="run-status">正在加载…</span>
        </div>
        <div id="run-next" class="run-next"></div>
      </div>
    </aside>

    <div class="main">
      <header class="page-header">
        <div class="page-heading">
          <h1 id="page-title" class="page-title" tabindex="-1">概览</h1>
          <p id="page-subtitle" class="page-subtitle"></p>
        </div>
        <div class="page-actions-bar">
          <!-- Page-specific actions; only the active page's group is shown -->
          <div class="page-actions" data-page="overview" hidden="hidden">
            <button id="overview-test" type="button" class="btn" title="测试向量化、大模型、Crossref 和已填写的 API Key">
              <svg xmlns="http://www.w3.org/2000/svg" class="icon" aria-hidden="true"><use href="#i-plug"/></svg>
              <span>测试连接</span>
            </button>
          </div>
          <div class="page-actions" data-page="inbox" hidden="hidden"></div>
          <div class="page-actions" data-page="survey" hidden="hidden">
            <button id="survey-new" type="button" class="btn" hidden="hidden" title="返回调研列表，开始一项新的调研">
              <svg xmlns="http://www.w3.org/2000/svg" class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
              <span>新调研</span>
            </button>
          </div>
          <div class="page-actions" data-page="settings" hidden="hidden"></div>
          <button id="run" type="button" class="btn primary" title="立即检查新文献">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>
            <span>立即检查</span>
          </button>
        </div>
      </header>

      <div id="progress" class="progress-strip" hidden="hidden" role="status">
        <div class="progress-row">
          <span id="progress-text" class="progress-text">准备中…</span>
          <span id="progress-count" class="progress-count"></span>
          <button id="cancel" type="button" class="btn ghost small">取消</button>
        </div>
        <div class="progress-track"><div id="progress-bar" class="progress-fill indeterminate"></div></div>
      </div>

      <div id="banner" class="banner" role="alert" hidden="hidden">
        <svg xmlns="http://www.w3.org/2000/svg" class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
        <span id="banner-text" class="banner-text"></span>
        <button id="banner-close" type="button" class="btn ghost small icon-only" title="关闭" aria-label="关闭">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
      </div>

      <main id="pages" class="pages">
        <!-- 概览: dashboard (overview.js) -->
        <section class="page" data-page="overview" id="page-overview" hidden="hidden">
          <div class="page-inner">
            <!-- Built by overview.js from api.getDashboard() -->
            <div id="overview-root" class="overview" aria-busy="true"></div>
          </div>
        </section>

        <!-- 推荐: the recommendations inbox (inbox.js) -->
        <section class="page" data-page="inbox" id="page-inbox" hidden="hidden">
          <div class="inbox-toolbar">
            <div class="inbox-toolbar-inner">
              <div class="inbox-toolbar-row">
                <div class="tabs" role="tablist" aria-label="推荐状态">
                  <button type="button" class="tab active" role="tab" aria-selected="true" data-tab="new">待查看<span id="count-new" class="tab-count">0</span></button>
                  <button type="button" class="tab" role="tab" aria-selected="false" data-tab="added">已加入<span id="count-added" class="tab-count">0</span></button>
                  <button type="button" class="tab" role="tab" aria-selected="false" data-tab="dismissed">已忽略<span id="count-dismissed" class="tab-count">0</span></button>
                </div>
                <label class="search-box">
                  <svg xmlns="http://www.w3.org/2000/svg" class="icon" aria-hidden="true"><use href="#i-search"/></svg>
                  <input id="inbox-search" class="input" type="search" placeholder="搜索标题、作者、期刊、方向…" aria-label="搜索推荐"/>
                </label>
              </div>
              <div class="inbox-toolbar-row" id="inbox-filters">
                <div class="seg" id="inbox-track" role="group" aria-label="来源">
                  <button type="button" class="active" aria-pressed="true" data-value="all">全部</button>
                  <button type="button" aria-pressed="false" data-value="personal"><span class="dot personal"></span>个性推荐</button>
                  <button type="button" aria-pressed="false" data-value="flagship"><span class="dot flagship"></span>顶刊地学</button>
                  <button type="button" aria-pressed="false" data-value="followed"><span class="dot followed"></span>关注作者</button>
                </div>
                <div class="seg" id="inbox-label" role="group" aria-label="筛选">
                  <button type="button" class="active" aria-pressed="true" data-value="all">全部</button>
                  <button type="button" aria-pressed="false" data-value="must_read">必读</button>
                  <button type="button" aria-pressed="false" data-value="latest">本次新增</button>
                </div>
                <div class="seg" id="inbox-sort" role="group" aria-label="排序">
                  <button type="button" class="active" aria-pressed="true" data-value="score">按分数</button>
                  <button type="button" aria-pressed="false" data-value="date">按日期</button>
                </div>
                <span class="toolbar-spacer"></span>
                <button id="inbox-dismiss" type="button" class="btn ghost small">全部忽略</button>
              </div>
            </div>
          </div>
          <div class="page-inner inbox-inner">
            <div id="inbox-notice" class="callout" hidden="hidden"></div>
            <div id="inbox-list" class="inbox-list"></div>
          </div>
        </section>

        <!-- 调研: topic surveys (survey.js) -->
        <section class="page" data-page="survey" id="page-survey" hidden="hidden">
          <div class="page-inner survey-inner">
            <!-- Built by survey.js: the new-survey form and history, or one survey (progress or result) -->
            <div id="survey-root" class="survey" aria-busy="true"></div>
          </div>
        </section>

        <!-- 设置: settings sections (settings.js) -->
        <section class="page" data-page="settings" id="page-settings" hidden="hidden">
          <div class="page-inner settings-inner">
            <!-- Built by settings.js: the section index and one view per section -->
            <div id="settings-root" class="settings"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
