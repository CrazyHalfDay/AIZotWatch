<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN" id="zotwatch-recommendations" windowtype="zotwatch:recommendations"
      width="1040" height="800" persist="screenX screenY width height sizemode">
<head>
  <meta charset="utf-8"/>
  <title>ZotWatch 文献推荐</title>
  <link rel="stylesheet" href="chrome://zotero-platform/content/zotero.css"/>
  <link rel="stylesheet" href="chrome://zotwatch/content/recommendations.css"/>
  <script src="chrome://zotwatch/content/recommendations.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="chrome://zotwatch/content/icons/icon.svg" alt="" width="28" height="28"/>
      <div>
        <h1>ZotWatch 文献推荐</h1>
        <p id="subtitle" class="muted">正在加载…</p>
      </div>
    </div>
    <div class="actions">
      <button id="run" class="primary" type="button">立即检查</button>
      <button id="prefs" type="button">设置</button>
    </div>
  </header>

  <section id="progress" class="progress" hidden="hidden">
    <div class="progress-text"><span id="progress-text">准备中…</span><button id="cancel" type="button" class="link">取消</button></div>
    <div class="bar"><div id="progress-bar"></div></div>
  </section>

  <section id="notice" class="notice" hidden="hidden"></section>

  <nav class="toolbar">
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="new">待查看 <span id="count-new">0</span></button>
      <button type="button" class="tab" data-tab="added">已加入 <span id="count-added">0</span></button>
      <button type="button" class="tab" data-tab="dismissed">已忽略 <span id="count-dismissed">0</span></button>
    </div>
    <div class="filters">
      <div class="segmented" id="label-filter">
        <button type="button" class="seg active" data-value="all">全部</button>
        <button type="button" class="seg" data-value="must_read">必读</button>
        <button type="button" class="seg" data-value="latest">本次新增</button>
      </div>
      <div class="segmented" id="sort">
        <button type="button" class="seg active" data-value="score">按分数</button>
        <button type="button" class="seg" data-value="date">按日期</button>
      </div>
      <input id="search" type="search" placeholder="搜索标题、作者、期刊…"/>
      <button id="dismiss-visible" type="button" class="link">全部忽略</button>
    </div>
  </nav>

  <main id="list" class="list"></main>
</body>
</html>
